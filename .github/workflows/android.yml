name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Accept Android SDK Licenses
      run: |
        yes | sdkmanager --licenses 2>/dev/null || true

    - name: Make Gradle wrapper executable
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Ensure environment files exist
      run: |
        touch .env
        if [ ! -f .env.example ]; then
          touch .env.example
        fi
        if [ ! -f app/google-services.json ]; then
          cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "1097762260600",
    "project_id": "gen-lang-client-0827314451",
    "storage_bucket": "gen-lang-client-0827314451.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:1097762260600:android:e42c8ce6686a413a6e8f8d",
        "android_client_info": {
          "package_name": "com.aistudio.espacio.kqzpt"
        }
      },
      "oauth_client": [
        {
          "client_id": "1097762260600-tbcai7mpoauiuu5p0k89otsmr55tcpfp.apps.googleusercontent.com",
          "client_type": 1,
          "android_info": {
            "package_name": "com.aistudio.espacio.kqzpt",
            "certificate_hash": "f873cb448af44a80d9fa7fe56ef73989e5d80fdf"
          }
        },
        {
          "client_id": "1097762260600-v3d9oojt1aal4u4t2ila1ggilijpiium.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyCEcvcSuqdg3xnKDhI-sDd2YPQef5PZNgE"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "1097762260600-v3d9oojt1aal4u4t2ila1ggilijpiium.apps.googleusercontent.com",
              "client_type": 3
            }
          ]
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
        fi

    - name: Prepare Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        elif [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
